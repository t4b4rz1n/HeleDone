name: madar

services:
  db:
    image: quay.io/sclorg/postgresql-16-c9s:latest
    container_name: madar_db
    environment:
      POSTGRESQL_DATABASE: madar_db
      POSTGRESQL_USER: madar_user
      POSTGRESQL_PASSWORD: madar_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U madar_user -d madar_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - network

  redis:
    image: quay.io/sclorg/redis-7-c9s:latest
    container_name: madar_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - network

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: madar_minio
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - network

  setup-minio:
    image: madar-api:latest
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: madar_minio_setup
    command: python scripts/setup-minio.py
    volumes:
      - ./apps/api:/app
    env_file:
      - path: ./apps/api/.env
        required: true
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    networks:
      - network

  api:
    image: madar-api:latest
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: madar_api
    command: sh scripts/entrypoint.sh
    volumes:
      - ./apps/api:/app
    ports:
      - "8000:8000"
    env_file:
      - path: ./apps/api/.env
        required: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      setup-minio:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - network

  web:
    image: madar-web:latest
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_API_VERSION: v1
        VITE_API_TIMEOUT: "30000"
    container_name: madar_web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - network

  worker:
    image: madar-api:latest
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: madar_worker
    command: celery -A config worker -l info
    volumes:
      - ./apps/api:/app
    env_file:
      - path: ./apps/api/.env
        required: true
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - network

  beat:
    image: madar-api:latest
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: madar_beat
    command: celery -A config beat -l info -s /tmp/celerybeat-schedule
    volumes:
      - ./apps/api:/app
    env_file:
      - path: ./apps/api/.env
        required: true
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - network

networks:
  network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
