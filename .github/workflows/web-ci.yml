name: Web CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main, develop]

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint web
        run: npm run lint -w apps/web

      - name: Check API integration
        run: npm run test:api -w apps/web

      - name: Check localization
        run: npm run test:i18n -w apps/web

      - name: Check shared UI components
        run: npm run test:coastal -w apps/web

      - name: Build web
        run: npm run build -w apps/web
        env:
          VITE_API_BASE_URL: /api
          VITE_API_VERSION: v1
          VITE_API_TIMEOUT: "30000"
          VITE_USE_MOCK: "false"
